name: 缺陷报告
description: 功能不符合预期、报错或崩溃
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索是否已有相同 Issue。**日志和截图里的 Cookie、令牌、密码、对外地址请先脱敏。**
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 期望的行为和实际的行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 镜像标签或提交，以及客户端版本
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: 出问题的端
      options: [服务端, Web, Android, Android TV, 插件]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      render: text
