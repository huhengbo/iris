version: 2
updates:
  - package-ecosystem: uv
    directories:
      - /backend
      - /packages/iris-plugin-sdk
      - /plugins/*
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: /client
    schedule:
      interval: weekly
    groups:
      dart:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
