name: release

on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check version
        run: uv run --python 3.13 scripts/version.py check "$GITHUB_REF_NAME"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check version
        run: uv run --python 3.13 scripts/version.py check "$GITHUB_REF_NAME"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # 配置了签名密钥才用 release 签名；否则退回 debug 签名（能安装，但不能覆盖 release 签名的版本）
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，APK 使用 debug 签名"
            exit 0
          fi
          mkdir -p secrets/android
          echo "$KEYSTORE_BASE64" | base64 -d > secrets/android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > secrets/android/key.properties
      - run: flutter pub get
        working-directory: client
      # 版本号取自根目录 VERSION（上面已校验与 tag、pubspec 一致）；versionCode = x*10000 + y*100 + z
      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="$(cat ../VERSION)" \
            --build-number="$(uv run --python 3.13 ../scripts/version.py code)"
        working-directory: client
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --python 3.13 scripts/version.py notes > release-notes.md
          # 客户端升级清单：客户端请求 releases/latest/download/update.json 检查更新
          uv run --python 3.13 scripts/version.py manifest client/build/app/outputs/flutter-apk > update.json
          gh release create "$GITHUB_REF_NAME" \
            --title "光圈 $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            client/build/app/outputs/flutter-apk/app-*-release.apk \
            update.json
