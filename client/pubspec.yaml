name: iris
description: "光圈：自托管影视库的客户端"
publish_to: 'none'
version: 0.1.0+3

environment:
  sdk: ^3.13.2

dependencies:
  android_intent_plus: ^6.1.0
  cached_network_image: ^4.0.4
  connectivity_plus: ^7.0.0
  dio: ^5.11.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_riverpod: ^3.4.3
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.2
  image_picker: ^1.1.2
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  multicast_dns: ^0.3.3+1
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  web: ^1.1.1
  webview_flutter: ^4.14.1
  xml: ^7.0.1
dependency_overrides:
  # 0.5.2 起 minSdk 提到 24，会和 Android 6 电视盒子（API 23）的兼容目标冲突
  file_selector_android: 0.5.1+17
dev_dependencies:
  file_selector_platform_interface: ^2.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    # CanvasKit 在国内无法访问 fonts.gstatic.com 时仍能正常显示中文。
    - family: Noto Sans CJK SC
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.v2.otf
          weight: 400
